# Cloudflare Pages project — static site + Pages Functions (functions/) + D1.
# Deploy with `npm run deploy` (or the GitHub Action on push to main).
name = "infinite-african-safaris"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "ias-leads"
# Placeholder for local dev (`npm run dev`). The GitHub deploy workflow looks up the
# real database (creating it on first run) and fills this in at deploy time.
database_id = "00000000-0000-0000-0000-000000000000"
